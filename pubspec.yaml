name: file_picker
description: A package that allows you to use a native file explorer to pick single or multiple absolute file paths, with extension filtering support.
homepage: https://github.com/miguelpruivo/plugins_flutter_file_picker
repository: https://github.com/miguelpruivo/flutter_file_picker
issue_tracker: https://github.com/miguelpruivo/flutter_file_picker/issues
version: 8.0.0+1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  flutter_plugin_android_lifecycle: ^2.0.17
  plugin_platform_interface: ^2.1.8
  ffi: ^2.0.1
  path: ^1.8.2
  win32: ^5.1.1
  cross_file: ^0.3.3+7

dev_dependencies:
  lints: ^3.0.0
  flutter_test:
    sdk: flutter

environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=3.7.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.mr.flutter.plugin.filepicker
        pluginClass: FilePickerPlugin
      ios:
        pluginClass: FilePickerPlugin
      web:
        pluginClass: FilePickerWeb
        fileName: _internal/file_picker_web.dart
      
      # AnhV2 fix: Package file_picker:linux references file_picker:linux as the default plugin, but it does not provide an inline implementation.
      # Ask the maintainers of file_picker to either avoid referencing a default implementation via `platforms: linux: default_package: file_picker` or add an inline
      # implementation to file_picker via `platforms: linux:` `pluginClass` or `dartPluginClass`.

      # macos:
      #   default_package: file_picker
      # windows:
      #   default_package: file_picker
      # linux:
      #   default_package: file_picker
